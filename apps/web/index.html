<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
    />
    <title>Webapp Kitchen Sink</title>
    <script src="https://telegram.org/js/telegram-web-app.js?63"></script>
  </head>
  <body>
    <!--
      createRoot().render() replaces this on a successful mount, so it is only
      ever seen when the bootstrap itself failed. Inline styles on purpose: the
      stylesheet is imported from main.tsx, which is exactly what did not run.
    -->
    <div id="root">
      <div
        style="
          display: flex;
          min-height: 100vh;
          flex-direction: column;
          align-items: center;
          justify-content: center;
          gap: 8px;
          padding: 24px;
          font-family: system-ui, sans-serif;
          text-align: center;
          color: #111827;
          background-color: #ffffff;
        "
      >
        <strong style="font-size: 18px">Failed to start</strong>
        <p style="margin: 0; font-size: 14px; color: #6b7280">
          The Telegram Web App SDK could not be loaded. Check your connection and
          reopen this app from Telegram.
        </p>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
